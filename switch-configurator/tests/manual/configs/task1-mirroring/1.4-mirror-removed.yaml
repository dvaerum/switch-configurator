# Test 1.4: Port Mirroring Removal
# Objective: Verify mirror configuration can be completely removed
# Run after test 1.1 to remove the mirroring

switches:
  - id: test-mirror-01
    hostname: cisco-c9300-24u-a
    management_ip: "192.168.1.100"  # Not used for serial, but required field
    model: CiscoCatalyst9300_24P_UPOE
    credentials:
      username: admin
      password: admin
      connection_type: serial
      serial_device: /dev/serial_cisco_c9300-24u-a
      baud_rate: 9600
    vlans:
      - id: 1
        name: default
    ports: []
    port_mirrors: []  # Empty - should remove all mirroring
