# Test Configuration: Per-Port MAC Notify Control with Global Traps Enabled
# This tests whether individual ports can disable MAC notifications when global mac-notify traps are enabled

switches:
  - id: test-aruba-2930f
    hostname: test-aruba-2930f
    model: Aruba2930F
    management_ip: "192.168.1.2"

    credentials:
      username: admin
      password: admin
      connection_type: serial
      serial_device: /dev/serial_aruba-2930F
      baud_rate: 115200

    vlans:
      - id: 42
        name: management
        description: Management VLAN
        ip_config: dhcp

      - id: 100
        name: servers

      - id: 300
        name: iot-devices

    ports:
      # Test Case 1: Port with MAC notify ENABLED
      - port_id: "1"
        mode: access
        vlan: 300
        description: "Test Port 1 - MAC notify ON"
        enabled: true
        mac_notify: true

      # Test Case 2: Port with MAC notify DISABLED (should not send traps even with global enabled)
      - port_id: "2"
        mode: access
        vlan: 300
        description: "Test Port 2 - MAC notify OFF"
        enabled: true
        mac_notify: false

      # Test Case 3: Another port with MAC notify ENABLED
      - port_id: "3"
        mode: access
        vlan: 300
        description: "Test Port 3 - MAC notify ON"
        enabled: true
        mac_notify: true

      # Test Case 4: Port with MAC notify DISABLED
      - port_id: "4"
        mode: access
        vlan: 300
        description: "Test Port 4 - MAC notify OFF"
        enabled: true
        mac_notify: false

    # SNMP Configuration - global mac-notify trap enabled
    snmp:
      communities:
        - name: "public"
          access: operator

      trap_receivers:
        - host: "192.168.1.1"
          community: "public"
          version: "2c"

      # Global trap enabled
      enabled_traps:
        - mac-notify

    settings:
      ssh_timeout_secs: 30
      max_retries: 3
      # Don't enforce port config to avoid resetting unconfigured ports
      enforce_port_config: false
