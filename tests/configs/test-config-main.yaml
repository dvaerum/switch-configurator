# Aruba Switch Configuration via Serial Connection
# This example shows how to configure an Aruba 2530-48G-2SFP+ switch using a serial connection

switches:
  - id: test-aruba-2530-48g-2sfp
    hostname: test-aruba-2530-48g-2sfp
    model: Aruba2530_48G_2SFP
    management_ip: "192.168.1.20"  # Not used for serial, but required field

    settings:
      ssh_timeout_secs: 30
      max_retries: 3
      enforce_port_config: true

    credentials:
      username: admin
      password: admin
      connection_type: serial
      # Find your serial device with: ls -l /dev/serial/by-id/
      serial_device: /dev/serial_aruba-2530-48g-2sfp+
      baud_rate: 115200  # Standard baud rate for Aruba switches

    vlans:
      - id: 42
        name: management
        description: Management VLAN
        ip_config: dhcp  # Get IP from DHCP server

      - id: 100
        name: servers

      - id: 200
        name: workstations

      - id: 300
        name: iot-devices

      - id: 400
        name: guest-wifi

      - id: 1001
        name: zone-1

      - id: 1002
        name: zone-2

      - id: 666
        name: WAN

      - id: 500
        name: network-mgmt

      - id: 600
        name: wireless-aps

      - id: 700
        name: "vlan-8x10-port-switch"

    ports:
      - port_id: "44"
        mode: access
        vlan: 700
        description: "Cross-connect VLAN 700 with the one set on port 8"
        enabled: true

      - port_id: "46"
        mode: access
        vlan: 42
        description: Power Distribution
        enabled: true

      - port_id: "47"
        mode: trunk
        vlan: 666  # Native VLAN
        allowed_vlans: [ 500, 600, 700 ]
        description: WAN
        enabled: true

      - port_id: "48"
        mode: trunk
        vlan: 42  # Native VLAN
        allowed_vlans: [ 666, 400, 300, 1001, 1002, 100, 200, 500, 600 ]
        description: Router
        enabled: true

    # SNMP Configuration for device tracking
    snmp:
      # SNMP communities for access control
      communities:
        - name: "public"
          access: operator  # Read-only access

        - name: "private"
          access: unrestricted  # Read-write access

      # SNMP trap receivers (monitoring servers)
      trap_receivers:
        - host: "192.168.1.1"  # Change to your monitoring server IP
          community: "public"
          version: "2c"

      # Types of traps to enable
      enabled_traps:
        - mac-notify      # MAC address learning/changes (new device detection)
        - link-change     # Port up/down events

    validation:
      enabled: true
      timeout: 60s
      on_failure: rollback
      rollback_method: restore_backup

      tests:
        # Verify SSH port is accessible
        - type: tcp_port_check
          ports: [22]        # SSH port
          timeout: 10s
          required: true
