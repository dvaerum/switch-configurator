# FortiSwitch SNMP and Trap Test
# Tests: SNMP communities, trap receivers, trap types

switches:
  - id: fortiswitch-snmp-test
    hostname: fortiswitch-108f
    model: Fortiswitch124F_FPOE
    management_ip: "192.168.1.100"

    settings:
      ssh_timeout_secs: 30
      max_retries: 3
      enforce_port_config: false

    credentials:
      username: admin
      password: "adminadmin"
      connection_type: serial
      serial_device: /dev/serial_fortiswitch_108f-poe
      baud_rate: 115200

    vlans:
      - id: 1
        name: default
        description: Default VLAN
        ip_config: none

      - id: 10
        name: management
        description: Management VLAN
        ip_config:
          address: "192.168.10.1"
          netmask: "255.255.255.0"

    ports:
      # Port 1: Standard port
      - port_id: "1"
        mode: access
        vlan: 10
        description: "Standard Port"
        enabled: true
        poe_enabled: false
        speed_duplex: auto

      # Port 2: PoE device
      - port_id: "2"
        mode: access
        vlan: 10
        description: "PoE Device"
        enabled: true
        poe_enabled: true
        speed_duplex: auto

    # SNMP configuration with multiple communities and trap receivers
    snmp:
      # SNMP communities for access control
      communities:
        - name: "public"
          access: operator  # Read-only access

        - name: "private"
          access: unrestricted  # Read-write access

        - name: "monitoring"
          access: operator

      # Multiple SNMP trap receivers
      trap_receivers:
        - host: "192.168.1.200"
          community: "public"
          version: "2c"

        - host: "192.168.1.201"
          community: "public"
          version: "2c"

        - host: "192.168.1.202"
          community: "monitoring"
          version: "2c"

      # Enable all trap types
      enabled_traps:
        - mac-notify
        - link-change

    validation:
      enabled: false
