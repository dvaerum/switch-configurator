# FortiSwitch Basic Functionality Test
# Tests: VLANs, access/trunk ports, PoE, speed settings, basic config

switches:
  - id: fortiswitch-basic-test
    hostname: fortiswitch-108f
    model: Fortiswitch124F_FPOE
    management_ip: "192.168.1.100"

    settings:
      ssh_timeout_secs: 30
      max_retries: 3
      enforce_port_config: false

    credentials:
      username: admin
      password: "adminadmin"
      connection_type: serial
      serial_device: /dev/serial_fortiswitch_108f-poe
      baud_rate: 115200

    vlans:
      # VLAN 1 - Default (no IP)
      - id: 1
        name: default
        description: Default VLAN
        ip_config: none

      # VLAN 10 - Management with DHCP
      - id: 10
        name: management
        description: Management VLAN
        ip_config: dhcp

      # VLAN 20 - Users with static IP
      - id: 20
        name: users
        description: User workstations
        ip_config:
          address: "10.0.20.1"
          netmask: "255.255.255.0"

    ports:
      # Port 1: Management - Access port, auto speed
      - port_id: "1"
        mode: access
        vlan: 10
        description: "Management Port"
        enabled: true
        poe_enabled: false
        speed_duplex: auto

      # Ports 2-4: User workstations - Access ports with PoE
      - port_id: "2-4"
        mode: access
        vlan: 20
        description: "User Workstations"
        enabled: true
        poe_enabled: true
        speed_duplex: auto

      # Port 5: Disabled port (for testing)
      - port_id: "5"
        mode: access
        vlan: 1
        description: "Disabled Test Port"
        enabled: false
        poe_enabled: false
        speed_duplex: auto

      # Port 6: 100Mbps forced speed
      - port_id: "6"
        mode: access
        vlan: 20
        description: "100Mbps Device"
        enabled: true
        poe_enabled: false
        speed_duplex: 100-full

      # Port 7: 1Gbps forced speed
      - port_id: "7"
        mode: access
        vlan: 20
        description: "1Gbps Device"
        enabled: true
        poe_enabled: false
        speed_duplex: 1000-full

      # Port 8: Trunk port
      - port_id: "8"
        mode: trunk
        vlan: 1  # Native VLAN
        allowed_vlans: [1, 10, 20]
        description: "Trunk Uplink"
        enabled: true
        poe_enabled: false
        speed_duplex: 1000-full

    validation:
      enabled: false
