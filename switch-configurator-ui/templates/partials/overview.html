<div class="card">
    <table>
        <tr><th style="width:200px;">Hostname</th><td>{{ switch.hostname }}</td></tr>
        <tr><th>Model</th><td>{{ switch.model }}</td></tr>
        <tr><th>Management IP</th><td>{{ switch.management_ip }}</td></tr>

    </table>
</div>
