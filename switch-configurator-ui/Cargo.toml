[package]
name = "switch-configurator-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "fs"] }

# Template engine
askama = "0.12"
askama_axum = "0.4"

# Async runtime
tokio = { version = "1.41", features = ["full"] }

# HTTP client for backend proxy
hyper = { version = "1.6", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy"] }
http-body-util = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Time
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Streaming
async-stream = "0.3"
futures-core = "0.3"

# Error handling
anyhow = "1.0"

# Shared types from backend
switch-configurator = { path = "../switch-configurator" }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.13"
